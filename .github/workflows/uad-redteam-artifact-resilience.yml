name: UAD red-team artifact resilience

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uad-redteam-security
  cancel-in-progress: false

jobs:
  artifact-resilience:
    name: Streamed package single-flight and recovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: uad-redteam
    defaults:
      run:
        working-directory: server
    env:
      UAD_REDTEAM_BASE_URL: https://homenode-api-redteam.onrender.com
      UAD_REDTEAM_FIXTURE_ACCOUNT_ID: UAD-REDTEAM-SFR-0001
      UAD_REDTEAM_OIDC_ISSUER: https://uad-redteam-identity.homenode.invalid
      UAD_REDTEAM_OIDC_AUDIENCE: homenode-uad-redteam-api
      UAD_REDTEAM_JWT_KEY_ID: uad-redteam-a44e618bc440bbbf
      UAD_REDTEAM_UNPROVISIONED_SUBJECT: uad-redteam-unprovisioned-user
      UAD_REDTEAM_JWT_PRIVATE_KEY: ${{ secrets.UAD_REDTEAM_JWT_PRIVATE_KEY }}
      UAD_REDTEAM_OIDC_SUBJECTS_JSON: ${{ secrets.UAD_REDTEAM_OIDC_SUBJECTS_JSON }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Regenerate one isolated streamed package twice concurrently
        run: npm run --silent verify:redteam:artifact-resilience
      - name: Preserve sanitized artifact resilience evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: uad-redteam-artifact-resilience-${{ github.run_id }}
          path: server/uad-redteam-artifact-resilience
          if-no-files-found: error
          retention-days: 14
