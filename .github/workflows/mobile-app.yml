name: Mobile app

on:
  pull_request:
    paths:
      - ".github/workflows/mobile-app.yml"
      - "homenode-mobile/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mobile-app.yml"
      - "homenode-mobile/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: homenode-mobile
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13
          cache: pnpm
          cache-dependency-path: homenode-mobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run doctor
