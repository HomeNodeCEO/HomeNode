name: Mobile app

on:
  pull_request:
    paths:
      - ".github/workflows/mobile-app.yml"
      - "homenode-mobile/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mobile-app.yml"
      - "homenode-mobile/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: homenode-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
      - run: corepack enable
      - run: corepack prepare pnpm@11.19.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run doctor
