name: UAD sales-rich pre-submission delivery gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/uad-successful-delivery.yml"
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/uad-successful-delivery.yml"

permissions:
  contents: read

jobs:
  signed-synthetic-sfr:
    name: Sales-rich signed synthetic SFR through XML, PDF, and ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: homenode_staging_delivery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d homenode_staging_delivery_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/homenode_staging_delivery_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Prepare isolated synthetic database
        run: |
          NODE_ENV=test node scripts/prepareUadCiDatabase.js
          node scripts/runUadMigrations.js
          NODE_ENV=staging node scripts/prepareUadStagingDatabase.js
      - name: Verify successful signed delivery path
        run: |
          set -o pipefail
          NODE_ENV=test npm run --silent verify:uad:successful-delivery:database | tee uad-successful-delivery-database.json
      - name: Preserve sanitized evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: uad-successful-delivery-${{ github.run_id }}
          path: server/uad-successful-delivery-database.json
          if-no-files-found: warn
          retention-days: 30
