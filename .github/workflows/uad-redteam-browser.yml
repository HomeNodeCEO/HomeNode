name: UAD red-team authenticated browser

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uad-redteam-security
  cancel-in-progress: false

jobs:
  authenticated-browser:
    name: Synthetic UAD browser workflow
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: uad-redteam
    defaults:
      run:
        working-directory: server
    env:
      UAD_REDTEAM_BASE_URL: https://homenode-api-redteam.onrender.com
      UAD_REDTEAM_APP_URL: https://homenode-uad-redteam.onrender.com
      UAD_REDTEAM_FIXTURE_ACCOUNT_ID: UAD-REDTEAM-SFR-0001
      UAD_REDTEAM_OIDC_ISSUER: https://uad-redteam-identity.homenode.invalid
      UAD_REDTEAM_OIDC_AUDIENCE: homenode-uad-redteam-api
      UAD_REDTEAM_JWT_KEY_ID: uad-redteam-a44e618bc440bbbf
      UAD_REDTEAM_UNPROVISIONED_SUBJECT: uad-redteam-unprovisioned-user
      UAD_REDTEAM_JWT_PRIVATE_KEY: ${{ secrets.UAD_REDTEAM_JWT_PRIVATE_KEY }}
      UAD_REDTEAM_OIDC_SUBJECTS_JSON: ${{ secrets.UAD_REDTEAM_OIDC_SUBJECTS_JSON }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Install pinned browser test runtime
        run: |
          npm install --no-save --ignore-scripts playwright@1.57.0
          npx playwright@1.57.0 install --with-deps chromium
      - name: Exercise the authenticated UAD browser workflow
        run: npm run --silent verify:redteam:browser
      - name: Preserve sanitized browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: uad-redteam-browser-${{ github.run_id }}
          path: server/uad-redteam-browser
          if-no-files-found: error
          retention-days: 14
