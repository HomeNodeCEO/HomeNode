name: Dependency security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "41 8 * * 2"

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate

  npm-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [server, dcad-frontend]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - run: npm ci
      - name: Reject moderate, high, or critical known vulnerabilities
        # Audit the immutable dependency graph from source control. This avoids
        # npm's legacy "quick" endpoint rejecting an otherwise valid installed
        # tree while preserving the same moderate-or-higher release gate. Retry
        # only recognized registry/network failures; vulnerability findings stay
        # fail-closed on the first response that reaches the advisory service.
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            audit_log="${RUNNER_TEMP}/npm-audit-${{ matrix.project }}-${attempt}.log"
            if npm audit --package-lock-only --audit-level=moderate \
              --fetch-retries=1 \
              --fetch-retry-mintimeout=1000 \
              --fetch-retry-maxtimeout=5000 \
              --fetch-timeout=120000 2>&1 | tee "${audit_log}"; then
              exit 0
            fi
            if ! grep -Eq \
              'audit endpoint returned an error|Service Unavailable|Bad Gateway|Gateway Timeout|Too Many Requests|ECONN|ETIMEDOUT|EAI_AGAIN' \
              "${audit_log}"; then
              exit 1
            fi
            if [ "${attempt}" -lt 3 ]; then
              echo "npm audit registry attempt ${attempt}/3 failed; retrying."
              sleep "$((attempt * 10))"
            fi
          done
          exit 1

  pnpm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: homenode-mobile
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13
          cache: pnpm
          cache-dependency-path: homenode-mobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Verify reviewed Expo toolchain patches and behavior
        run: pnpm run verify:toolchain
      - name: Reject moderate, high, or critical known vulnerabilities
        # Keep the unfiltered audit visible. The two exact, locally patched
        # Expo/Metro toolchain advisories have no published fixed versions.
        # This temporary exception expires after 2026-10-19; every other
        # Moderate/High/Critical advisory remains blocking. See
        # docs/UAD_SECURITY_TESTING.md before changing this scope or deadline.
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(date -u +%F)" > "2026-10-19" ]]; then
            echo "::error::Mobile advisory exception expired; review GHSA-86w9-cpqp-85rv and GHSA-vfj7-8cjw-p6xm before release."
            exit 1
          fi
          if pnpm audit --fetch-timeout=300000 --audit-level=moderate; then
            exit 0
          fi
          echo "::warning::Checking only the two reviewed Expo/Metro advisories as temporary exceptions."
          pnpm audit --fetch-timeout=300000 --audit-level=moderate \
            --ignore GHSA-86w9-cpqp-85rv \
            --ignore GHSA-vfj7-8cjw-p6xm

  pip-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - requirements: dcad-scraper-with-api/requirements.txt
            run_tests: true
          - requirements: dcad-scraper-with-api/dcad-scraper/scraper/requirements.txt
            run_tests: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}
      - run: python -m pip install --disable-pip-version-check pip-audit
      - name: Install active scraper dependencies
        if: matrix.run_tests
        run: python -m pip install --disable-pip-version-check -r "${{ matrix.requirements }}"
      - name: Compile active scraper and maintenance modules
        if: matrix.run_tests
        run: python -m compileall -q dcad-backend/app dcad-scraper-with-api/scraper dcad-scraper-with-api/tools
      - name: Run scraper regression tests
        if: matrix.run_tests
        env:
          PYTHONPATH: dcad-scraper-with-api
        run: python -m unittest discover -s dcad-scraper-with-api/tests -v
      - name: Run legacy DCAD backend security tests
        if: matrix.run_tests
        run: python -m unittest discover -s dcad-backend/tests -v
      - name: Reject known Python vulnerabilities
        run: python -m pip_audit -r "${{ matrix.requirements }}"
