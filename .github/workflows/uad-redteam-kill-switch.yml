name: UAD red-team kill switch

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uad-redteam-security
  cancel-in-progress: false

jobs:
  kill-switch:
    name: Disabled-workspace behavior
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: uad-redteam
    defaults:
      run:
        working-directory: server
    env:
      UAD_REDTEAM_BASE_URL: https://homenode-api-redteam.onrender.com
      UAD_REDTEAM_TIMEOUT_MS: "20000"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Verify the workspace kill switch
        shell: bash
        run: |
          set -o pipefail
          npm run --silent verify:redteam:kill-switch | tee uad-redteam-kill-switch.json
      - name: Preserve sanitized evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: uad-redteam-kill-switch-${{ github.run_id }}
          path: server/uad-redteam-kill-switch.json
          if-no-files-found: error
          retention-days: 14
