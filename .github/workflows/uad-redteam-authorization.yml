name: UAD red-team authorization

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uad-redteam-security
  cancel-in-progress: false

jobs:
  authenticated-matrix:
    name: Authenticated role and tenant matrix
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: uad-redteam
    defaults:
      run:
        working-directory: server
    env:
      UAD_REDTEAM_BASE_URL: https://homenode-api-redteam.onrender.com
      UAD_REDTEAM_FIXTURE_ACCOUNT_ID: UAD-REDTEAM-SFR-0001
      UAD_REDTEAM_TIMEOUT_MS: "20000"
      UAD_REDTEAM_OIDC_ISSUER: https://uad-redteam-identity.homenode.invalid
      UAD_REDTEAM_OIDC_AUDIENCE: homenode-uad-redteam-api
      UAD_REDTEAM_JWT_KEY_ID: uad-redteam-a44e618bc440bbbf
      UAD_REDTEAM_UNPROVISIONED_SUBJECT: uad-redteam-unprovisioned-user
      UAD_REDTEAM_JWT_PRIVATE_KEY: ${{ secrets.UAD_REDTEAM_JWT_PRIVATE_KEY }}
      UAD_REDTEAM_OIDC_SUBJECTS_JSON: ${{ secrets.UAD_REDTEAM_OIDC_SUBJECTS_JSON }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Run sanitized authenticated authorization matrix
        shell: bash
        run: |
          set -o pipefail
          npm run --silent verify:redteam:authorization | tee uad-redteam-authorization.json
      - name: Preserve sanitized evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: uad-redteam-authorization-${{ github.run_id }}
          path: server/uad-redteam-authorization.json
          if-no-files-found: error
          retention-days: 14
